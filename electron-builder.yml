appId: com.asharevolpulse.app
productName: A股能量看板
directories:
  buildResources: assets/icons
  output: release
files:
  - out/**/*
  - package.json
  - "!node_modules/**/*"
asar: true
compression: normal
electronLanguages:
  - zh-CN
  - en-US
npmRebuild: false
win:
  icon: assets/icons/icon.ico
  target:
    - target: zip
      arch:
        - x64
  artifactName: ashare-volpulse-${version}-win-${arch}.${ext}
mac:
  icon: assets/icons/icon.icns
  category: public.app-category.finance
  identity: null
  target:
    - target: dmg
      arch:
        - arm64
        - x64
  artifactName: ashare-volpulse-${version}-mac-${arch}.${ext}
dmg:
  format: UDBZ
  artifactName: ashare-volpulse-${version}-mac-${arch}.${ext}
